[package]
name = "atomic-bomb-engine-py"
version = "0.41.3"
edition = "2021"

[lib]
name = "atomic_bomb_engine"
crate-type = ["cdylib"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
atomic-bomb-engine = "0.41.1"
#atomic-bomb-engine = { git = "https://github.com/we-lsp/atomic-bomb-engine.git", branch = "ExponentialMovingAverage"}
tokio = "1.36.0"
pyo3-async-runtimes = { version = "0.23", features = ["attributes", "tokio-runtime"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = [] }
serde-pyobject = "0.6.2"
async-std = "1.12.0"
async-stream = "0.3.5"
futures = "0.3.30"
tokio-stream = "0.1.15"
anyhow = "1.0.83"
pythonize = "0.23"

[build]
rustflags = ["-C", "target-feature=+crt-static"]


[dependencies.pyo3]
version = "0.23.5"
features = ["extension-module", "auto-initialize"]

[tool.maturin]
name = "atomic_bomb_engine"
scripts = "python/atomic_bomb_engine"
